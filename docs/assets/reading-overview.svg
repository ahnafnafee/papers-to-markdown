<text x="68" y="219" font-family="Georgia, serif" font-size="9" font-weight="700" fill="#242b29">1  Introduction</text>
<text x="68" y="233" font-family="Georgia, serif" font-size="6.8" font-weight="400" fill="#242b29">A spatial interface places</text>
<text x="68" y="243" font-family="Georgia, serif" font-size="6.8" font-weight="400" fill="#242b29">information beside the</text>
<text x="68" y="253" font-family="Georgia, serif" font-size="6.8" font-weight="400" fill="#242b29">objects to which it refers.</text>
<text x="68" y="263" font-family="Georgia, serif" font-size="6.8" font-weight="400" fill="#242b29">This sample paper describes</text>
<text x="68" y="273" font-family="Georgia, serif" font-size="6.8" font-weight="400" fill="#242b29">a study in which readers</text>
<text x="68" y="283" font-family="Georgia, serif" font-size="6.8" font-weight="400" fill="#242b29">inspect a room, compare two</text>
<text x="68" y="293" font-family="Georgia, serif" font-size="6.8" font-weight="400" fill="#242b29">views, and follow a</text>
<text x="68" y="303" font-family="Georgia, serif" font-size="6.8" font-weight="400" fill="#242b29">sequence of observations.</text>
<text x="68" y="313" font-family="Georgia, serif" font-size="6.8" font-weight="400" fill="#242b29">The text and diagram are</text>
<text x="68" y="323" font-family="Georgia, serif" font-size="6.8" font-weight="400" fill="#242b29">illustrative.</text>
<text x="183" y="219" font-family="Georgia, serif" font-size="6.8" font-weight="400" fill="#242b29">A spatial interface places</text>
<text x="183" y="229" font-family="Georgia, serif" font-size="6.8" font-weight="400" fill="#242b29">information beside the</text>
<text x="183" y="239" font-family="Georgia, serif" font-size="6.8" font-weight="400" fill="#242b29">objects to which it refers.</text>
<text x="183" y="249" font-family="Georgia, serif" font-size="6.8" font-weight="400" fill="#242b29">This sample paper describes</text>
