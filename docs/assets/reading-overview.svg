<text x="430" y="302" font-family="Verdana, sans-serif" font-size="18" font-weight="700" fill="#242b29">1  Introduction</text>
<text x="430" y="336" font-family="Verdana, sans-serif" font-size="17.5" font-weight="400" fill="#242b29">A spatial interface places information</text>
<text x="430" y="363" font-family="Verdana, sans-serif" font-size="17.5" font-weight="400" fill="#242b29">beside the objects to which it refers. This</text>
<text x="430" y="390" font-family="Verdana, sans-serif" font-size="17.5" font-weight="400" fill="#242b29">sample paper describes a study in which</text>
<text x="430" y="417" font-family="Verdana, sans-serif" font-size="17.5" font-weight="400" fill="#242b29">readers inspect a room, compare two views,</text>
<text x="430" y="444" font-family="Verdana, sans-serif" font-size="17.5" font-weight="400" fill="#242b29">and follow a sequence of observations.</text>
<text x="430" y="489" font-family="Verdana, sans-serif" font-size="17.5" font-weight="400" fill="#242b29">Each section retains its place in the</text>
<text x="430" y="516" font-family="Verdana, sans-serif" font-size="17.5" font-weight="400" fill="#242b29">paper. Figures and equations keep their</text>
<text x="430" y="543" font-family="Verdana, sans-serif" font-size="17.5" font-weight="400" fill="#242b29">source appearance, with original-page</text>
<text x="430" y="570" font-family="Verdana, sans-serif" font-size="17.5" font-weight="400" fill="#242b29">markers to support comparison.</text>
